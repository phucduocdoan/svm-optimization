<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="t d"><title id="t">Kiến trúc module SVM</title><desc id="d">Horizontal software architecture showing experiments, data, model, optimizer, math utilities and evaluation.</desc><defs><style>.h{font:700 34px Arial;fill:#17233b}.sub{font:18px Arial;fill:#62718a}.card{stroke-width:2;rx:18}.ct{font:700 24px Arial;fill:#17233b}.st{font:17px Arial;fill:#4a5b73}.tag{font:700 15px Arial;letter-spacing:1px}.line{stroke:#8695aa;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8695aa"/></marker></defs><rect width="1600" height="850" fill="#f6f8fc"/><text x="65" y="70" class="h">Kiến trúc mã nguồn theo trách nhiệm</text><text x="65" y="108" class="sub">Entry points gọi model; model phối hợp kernel và optimizer; các module toán và evaluation độc lập để kiểm chứng</text><rect x="65" y="235" width="250" height="170" class="card" fill="#eaf0ff" stroke="#bdd0ff"/><text x="95" y="280" class="tag" fill="#356ae6">ENTRY POINTS</text><text x="95" y="330" class="ct">experiments/</text><text x="95" y="370" class="st">load · train · compare</text><path d="M315 320H380" class="line" marker-end="url(#arr)"/><rect x="390" y="235" width="250" height="170" class="card" fill="#fff" stroke="#d8e0ec"/><text x="420" y="280" class="tag" fill="#138a83">DATA</text><text x="420" y="330" class="ct">data.py</text><text x="420" y="370" class="st">UCI · labels · cache</text><path d="M640 320H705" class="line" marker-end="url(#arr)"/><rect x="715" y="195" width="330" height="250" class="card" fill="#e5f5f2" stroke="#b4e0d7"/><text x="745" y="240" class="tag" fill="#138a83">MODEL LAYER</text><text x="745" y="290" class="ct">KernelSVM</text><text x="745" y="330" class="st">fit · decision_function · predict</text><rect x="745" y="360" width="270" height="60" rx="12" fill="#fff" stroke="#c5e8e1"/><text x="880" y="398" text-anchor="middle" class="st">kernel.py · Linear / RBF</text><path d="M1045 320H1110" class="line" marker-end="url(#arr)"/><rect x="1120" y="195" width="405" height="250" class="card" fill="#f0ecfb" stroke="#d4c7f1"/><text x="1150" y="240" class="tag" fill="#7757c7">OPTIMIZATION LAYER</text><text x="1150" y="290" class="ct">SMOOptimizer</text><text x="1150" y="330" class="st">KKT checks · bounds · pair updates</text><rect x="1150" y="360" width="345" height="60" rx="12" fill="#fff" stroke="#ded6f2"/><text x="1322" y="398" text-anchor="middle" class="st">optimization/smo.py</text><rect x="390" y="550" width="655" height="210" class="card" fill="#fff2e3" stroke="#f1d3ae"/><text x="420" y="595" class="tag" fill="#c77822">MATH TOOLBOX</text><rect x="420" y="625" width="185" height="95" rx="12" fill="#fff" stroke="#efdbbf"/><text x="512" y="667" text-anchor="middle" class="st" font-weight="700">geometry.py</text><text x="512" y="697" text-anchor="middle" class="st">norm · margin</text><rect x="625" y="625" width="185" height="95" rx="12" fill="#fff" stroke="#efdbbf"/><text x="717" y="667" text-anchor="middle" class="st" font-weight="700">primal.py</text><text x="717" y="697" text-anchor="middle" class="st">hinge · objective</text><rect x="830" y="625" width="185" height="95" rx="12" fill="#fff" stroke="#efdbbf"/><text x="922" y="667" text-anchor="middle" class="st" font-weight="700">dual.py / kkt.py</text><text x="922" y="697" text-anchor="middle" class="st">dual · feasibility</text><path d="M920 445V535" class="line" marker-end="url(#arr)"/><path d="M1322 445V510H1070V570" class="line" marker-end="url(#arr)"/><rect x="1120" y="550" width="405" height="210" class="card" fill="#e8f5ed" stroke="#c4e5d1"/><text x="1150" y="595" class="tag" fill="#26845b">EVALUATION</text><rect x="1150" y="625" width="165" height="95" rx="12" fill="#fff" stroke="#cde8d8"/><text x="1232" y="667" text-anchor="middle" class="st" font-weight="700">evaluation.py</text><text x="1232" y="697" text-anchor="middle" class="st">metrics · CM</text><rect x="1330" y="625" width="165" height="95" rx="12" fill="#fff" stroke="#cde8d8"/><text x="1412" y="667" text-anchor="middle" class="st" font-weight="700">visualization.py</text><text x="1412" y="697" text-anchor="middle" class="st">plots · boundary</text><text x="65" y="810" class="sub">Cách đọc: experiments → data/model → kernel &amp; optimizer → math → evaluation/visualization.</text></svg>