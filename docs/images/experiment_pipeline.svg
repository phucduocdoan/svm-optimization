<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="t d"><title id="t">Pipeline thực nghiệm SVM</title><desc id="d">Dataset and preprocessing branches into scikit-learn and custom SMO, then converge for evaluation and reporting.</desc><defs><style>.h{font:700 34px Arial;fill:#17233b}.sub{font:18px Arial;fill:#62718a}.ct{font:700 22px Arial;fill:#17233b}.st{font:17px Arial;fill:#506079}.tag{font:700 15px Arial;letter-spacing:1px}.box{stroke-width:2;rx:18}.arr{stroke:#8191a8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8191a8"/></marker></defs><rect width="1600" height="850" fill="#f6f8fc"/><text x="65" y="70" class="h">Pipeline thực nghiệm có đối chứng</text><text x="65" y="108" class="sub">Giữ cùng cách chia dữ liệu và cùng test set để so sánh baseline với bộ giải tự cài</text><rect x="65" y="300" width="260" height="155" class="box" fill="#eaf0ff" stroke="#bed0ff"/><text x="95" y="345" class="tag" fill="#356ae6">DATASET</text><text x="95" y="390" class="ct">UCI Banknote</text><text x="95" y="425" class="st">1,372 mẫu · 4 features</text><path d="M325 377H390" class="arr" marker-end="url(#a)"/><rect x="400" y="270" width="305" height="215" class="box" fill="#fff" stroke="#d8e0ec"/><text x="430" y="315" class="tag" fill="#138a83">PREPROCESSING</text><text x="430" y="360" class="ct">Validate &amp; encode</text><text x="430" y="400" class="st">Stratified train/test split</text><text x="430" y="440" class="st">Fit scaler on train only</text><path d="M705 377H770" class="arr" marker-end="url(#a)"/><path d="M770 377V220H850" class="arr" marker-end="url(#a)"/><path d="M770 377V535H850" class="arr" marker-end="url(#a)"/><rect x="860" y="145" width="300" height="150" class="box" fill="#eaf0ff" stroke="#bed0ff"/><text x="890" y="188" class="tag" fill="#356ae6">BASELINE</text><text x="890" y="235" class="ct">sklearn SVC</text><text x="890" y="270" class="st">Pipeline + StandardScaler</text><rect x="860" y="460" width="300" height="150" class="box" fill="#f0ecfb" stroke="#d4c7f1"/><text x="890" y="503" class="tag" fill="#7757c7">CUSTOM</text><text x="890" y="550" class="ct">KernelSVM + SMO</text><text x="890" y="585" class="st">Linear / RBF kernel</text><path d="M1160 220H1225V377H1280" class="arr" marker-end="url(#a)"/><path d="M1160 535H1225V377" class="arr"/><rect x="1290" y="285" width="250" height="185" class="box" fill="#e8f5ed" stroke="#c4e5d1"/><text x="1320" y="330" class="tag" fill="#26845b">EVALUATE</text><text x="1320" y="375" class="ct">Same held-out test</text><text x="1320" y="415" class="st">Metrics · SV count</text><text x="1320" y="445" class="st">Objective · convergence</text><path d="M1415 470V565" class="arr" marker-end="url(#a)"/><rect x="1210" y="575" width="330" height="120" class="box" fill="#fff2e3" stroke="#f1d3ae"/><text x="1240" y="620" class="tag" fill="#c77822">OUTPUT</text><text x="1240" y="665" class="ct">Analysis &amp; report</text><text x="65" y="770" class="sub">Lưu ý: chọn C/gamma bằng validation trên train; test set chỉ dùng để đánh giá cuối cùng.</text></svg>