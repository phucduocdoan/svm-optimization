<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Roadmap SVM Optimization Lab</title><desc id="d">Four horizontal phases: model, derive mathematics, optimize, and verify on real data.</desc><defs><style>.h{font:700 34px Arial;fill:#17233b}.sub{font:18px Arial;fill:#5f6f86}.card{stroke-width:2;rx:22}.num{font:700 18px Arial;fill:#fff}.ct{font:700 24px Arial;fill:#17233b}.st{font:17px Arial;fill:#43536b}.ar{stroke:#8292aa;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8292aa"/></marker></defs><rect width="1600" height="720" fill="#f5f7fb"/><text x="70" y="72" class="h">Lộ trình đồ án SVM Optimization</text><text x="70" y="108" class="sub">Học theo chuỗi logic của bài toán tối ưu — mỗi phase tạo ra một đầu ra có thể kiểm chứng</text><g filter="none"><rect x="65" y="185" width="340" height="425" class="card" fill="#eaf0ff" stroke="#b8caff"/><rect x="440" y="185" width="340" height="425" class="card" fill="#e5f5f2" stroke="#a9ddd4"/><rect x="815" y="185" width="340" height="425" class="card" fill="#f0ecfb" stroke="#d3c6f0"/><rect x="1190" y="185" width="340" height="425" class="card" fill="#fff2e3" stroke="#f1d2aa"/></g><g><circle cx="105" cy="230" r="24" fill="#356ae6"/><text x="105" y="236" text-anchor="middle" class="num">01</text><text x="145" y="238" class="ct">Mô hình hóa</text><text x="100" y="305" class="st">• Hình học hyperplane</text><text x="100" y="350" class="st">• Margin và support vectors</text><text x="100" y="395" class="st">• Soft-margin và slack ξ</text><text x="100" y="440" class="st">• Primal QP</text><rect x="95" y="510" width="280" height="62" rx="14" fill="#fff" stroke="#cbd8f5"/><text x="235" y="548" text-anchor="middle" class="st" font-weight="700">Đầu ra: mô hình Primal</text></g><g><circle cx="480" cy="230" r="24" fill="#138a83"/><text x="480" y="236" text-anchor="middle" class="num">02</text><text x="520" y="238" class="ct">Biến đổi toán</text><text x="475" y="305" class="st">• Lagrangian và multiplier</text><text x="475" y="350" class="st">• Đạo hàm theo w, b, ξ</text><text x="475" y="395" class="st">• Stationarity</text><text x="475" y="440" class="st">• Dual QP và box constraints</text><rect x="470" y="510" width="280" height="62" rx="14" fill="#fff" stroke="#c4e6df"/><text x="610" y="548" text-anchor="middle" class="st" font-weight="700">Đầu ra: bài toán Dual</text></g><g><circle cx="855" cy="230" r="24" fill="#7757c7"/><text x="855" y="236" text-anchor="middle" class="num">03</text><text x="895" y="238" class="ct">Giải tối ưu</text><text x="850" y="305" class="st">• Bốn nhóm điều kiện KKT</text><text x="850" y="350" class="st">• Chọn working pair</text><text x="850" y="395" class="st">• Cập nhật cặp alpha</text><text x="850" y="440" class="st">• Điều kiện dừng và hội tụ</text><rect x="845" y="510" width="280" height="62" rx="14" fill="#fff" stroke="#ded5f3"/><text x="985" y="548" text-anchor="middle" class="st" font-weight="700">Đầu ra: SMO optimizer</text></g><g><circle cx="1230" cy="230" r="24" fill="#c77822"/><text x="1230" y="236" text-anchor="middle" class="num">04</text><text x="1270" y="238" class="ct">Kiểm chứng</text><text x="1225" y="305" class="st">• KernelSVM Linear / RBF</text><text x="1225" y="350" class="st">• Banknote Authentication</text><text x="1225" y="395" class="st">• So sánh SVC và SMO</text><text x="1225" y="440" class="st">• Phân tích và báo cáo</text><rect x="1220" y="510" width="280" height="62" rx="14" fill="#fff" stroke="#f0dbbd"/><text x="1360" y="548" text-anchor="middle" class="st" font-weight="700">Đầu ra: bằng chứng thực nghiệm</text></g><path d="M408 395H432" class="ar" marker-end="url(#a)"/><path d="M783 395H807" class="ar" marker-end="url(#a)"/><path d="M1158 395H1182" class="ar" marker-end="url(#a)"/><text x="70" y="665" class="sub">Gợi ý: học mỗi phase theo thứ tự concept → ví dụ số → module Python → câu hỏi tự kiểm tra.</text></svg>