<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">Một vòng cập nhật SMO</title><desc id="d">SMO selects two alpha variables, computes feasible bounds, performs a pair update, updates bias and checks KKT.</desc><defs><style>.h{font:700 34px Arial;fill:#17233b}.sub{font:18px Arial;fill:#62718a}.ct{font:700 20px Arial;fill:#17233b}.st{font:16px Arial;fill:#52627a}.box{stroke-width:2;rx:16}.line{stroke:#8090a6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8090a6"/></marker></defs><rect width="1500" height="760" fill="#f6f8fc"/><text x="65" y="70" class="h">Một vòng cập nhật trong SMO</text><text x="65" y="108" class="sub">Cập nhật hai biến alpha đồng thời để vẫn giữ ràng buộc đẳng thức của bài toán Dual</text><rect x="65" y="250" width="205" height="160" class="box" fill="#eaf0ff" stroke="#bed0ff"/><text x="95" y="295" class="ct">1. Chọn cặp</text><text x="95" y="338" class="st">Chọn αᵢ, αⱼ</text><text x="95" y="375" class="st">có vi phạm KKT</text><path d="M270 330H325" class="line" marker-end="url(#a)"/><rect x="335" y="250" width="205" height="160" class="box" fill="#e5f5f2" stroke="#b4e0d7"/><text x="365" y="295" class="ct">2. Bounds</text><text x="365" y="338" class="st">Tính L và H</text><text x="365" y="375" class="st">giữ 0 ≤ α ≤ C</text><path d="M540 330H595" class="line" marker-end="url(#a)"/><rect x="605" y="250" width="230" height="160" class="box" fill="#f0ecfb" stroke="#d4c7f1"/><text x="635" y="295" class="ct">3. Pair update</text><text x="635" y="338" class="st">Tối ưu αⱼ trong [L,H]</text><text x="635" y="375" class="st">suy ra αᵢ mới</text><path d="M835 330H890" class="line" marker-end="url(#a)"/><rect x="900" y="250" width="220" height="160" class="box" fill="#fff2e3" stroke="#f1d3ae"/><text x="930" y="295" class="ct">4. Cập nhật b</text><text x="930" y="338" class="st">Tính b₁ và b₂</text><text x="930" y="375" class="st">cập nhật error cache</text><path d="M1120 330H1175" class="line" marker-end="url(#a)"/><rect x="1185" y="250" width="250" height="160" class="box" fill="#e8f5ed" stroke="#c4e5d1"/><text x="1215" y="295" class="ct">5. Kiểm tra KKT</text><text x="1215" y="338" class="st">Còn vi phạm?</text><text x="1215" y="375" class="st">xét cặp tiếp theo</text><path d="M1310 410V530H165V425" class="line" marker-end="url(#a)"/><rect x="430" y="555" width="650" height="105" rx="18" fill="#fff" stroke="#d8e0ec" stroke-width="2"/><text x="755" y="598" text-anchor="middle" class="ct">Điều kiện được bảo toàn sau mỗi lần cập nhật</text><text x="755" y="635" text-anchor="middle" class="st">yᵢ Δαᵢ + yⱼ Δαⱼ = 0  ⇒  Σ αₖ yₖ = 0</text><text x="65" y="710" class="sub">SMO không phải Gradient Descent thông thường: nó giải lặp các bài toán con hai biến của Dual.</text></svg>