<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="t d"><title id="t">Soft margin SVM 2D</title><desc id="d">Illustrative two-class sample, decision line, margins, support vectors and a margin violation with positive slack.</desc><defs><style>.h{font:700 30px Arial;fill:#17233b}.label{font:18px Arial;fill:#34445d}.small{font:15px Arial;fill:#586982}.grid{stroke:#e5eaf1;stroke-width:1}.neg{fill:#356ae6;stroke:#fff;stroke-width:2}.pos{fill:#d66a3a;stroke:#fff;stroke-width:2}.sv{fill:none;stroke:#17233b;stroke-width:3}.m{stroke:#138a83;stroke-width:3;stroke-dasharray:10 8}.dec{stroke:#17233b;stroke-width:4}</style></defs><rect width="1100" height="680" fill="#f6f8fc"/><text x="55" y="60" class="h">Soft-margin SVM — ví dụ minh họa 2D</text><rect x="75" y="105" width="950" height="485" rx="16" fill="#fff" stroke="#d8e0ec" stroke-width="2"/><path d="M100 200H1000M100 300H1000M100 400H1000M100 500H1000M250 120V570M400 120V570M550 120V570M700 120V570M850 120V570" class="grid"/><path d="M130 560H980M130 560V135" stroke="#73839a" stroke-width="2" fill="none"/><path d="M190 555L845 135" class="m"/><path d="M245 590L900 170" class="dec"/><path d="M300 625L955 205" class="m"/><g class="neg"><circle cx="230" cy="430" r="12"/><circle cx="300" cy="480" r="12"/><circle cx="360" cy="390" r="12"/><circle cx="420" cy="475" r="12"/><circle cx="470" cy="345" r="12"/><circle cx="525" cy="405" r="12"/><circle cx="350" cy="520" r="12"/></g><g class="pos"><path d="M650 200l-13 23h26z M730 260l-13 23h26z M800 180l-13 23h26z M875 285l-13 23h26z M780 350l-13 23h26z M640 320l-13 23h26z M930 220l-13 23h26z"/></g><circle cx="525" cy="405" r="22" class="sv"/><circle cx="650" cy="200" r="22" class="sv"/><path d="M565 355l-14 25h28z" class="pos"/><circle cx="565" cy="363" r="22" class="sv"/><path d="M580 352l24 24m0-24l-24 24" stroke="#c23c50" stroke-width="4"/><path d="M605 375L700 445" stroke="#8795a8" stroke-width="2"/><text x="710" y="455" class="label">ξᵢ &gt; 0</text><rect x="120" y="125" width="290" height="125" rx="12" fill="#fff" stroke="#d8e0ec"/><circle cx="150" cy="160" r="9" class="neg"/><text x="172" y="166" class="small">Lớp −1</text><path d="M150 185l-10 18h20z" class="pos"/><text x="172" y="201" class="small">Lớp +1</text><circle cx="150" cy="225" r="12" class="sv"/><text x="172" y="231" class="small">Support vector</text><text x="1000" y="620" text-anchor="end" class="small">Hình minh họa khái niệm — không phải kết quả Banknote.</text></svg>